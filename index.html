<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Cambiar tema">🌙 Oscuro</button>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd>/<kbd>Esc</kbd> pausa</li>
            <li><kbd>T</kbd> tema</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-records" class="records-section" hidden>
          <form id="record-form" class="record-form" hidden>
            <p id="record-msg"></p>
            <div class="record-row">
              <input id="record-name" type="text" maxlength="12" autocomplete="off" placeholder="Tu nombre" aria-label="Nombre" />
              <button type="submit" id="record-save">Guardar</button>
            </div>
          </form>
          <div id="overlay-table"></div>
          <p id="overlay-stats" class="records-stats"></p>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">RECORDS</p>
        <div id="start-table"></div>
        <p id="start-stats" class="records-stats"></p>
        <button id="start-btn" type="button">Jugar</button>
        <button id="reset-records-btn" type="button" class="link-btn">Resetear records</button>
        <div id="reset-confirm" class="reset-confirm" hidden>
          <span>¿Borrar todo?</span>
          <button id="reset-yes" type="button">Sí</button>
          <button id="reset-no" type="button">No</button>
        </div>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-label="Menú de pausa">
      <div class="overlay-box pause-box">
        <p id="pause-title">PAUSA</p>
        <button type="button" id="resume-btn" class="pause-btn">Reanudar</button>
        <button type="button" id="pause-restart-btn" class="pause-btn">Reiniciar</button>
        <button type="button" id="controls-btn" class="pause-btn" aria-expanded="false">Ver controles</button>
        <ul id="pause-controls" class="hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          <li><kbd>T</kbd> tema</li>
        </ul>
        <label class="pause-level">Nivel inicial
          <select id="start-level">
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
